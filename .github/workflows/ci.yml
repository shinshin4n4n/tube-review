name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  typecheck:
    name: Type Check
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npx tsc --noEmit

  test:
    name: Unit Tests
    needs: typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Create .env.local for tests
        run: |
          cat > .env.local << EOF
          NEXT_PUBLIC_SUPABASE_URL=https://dummy.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY=dummy-anon-key
          YOUTUBE_API_KEY=dummy-youtube-api-key
          SUPABASE_SERVICE_ROLE_KEY=dummy-service-role-key
          NEXTAUTH_SECRET=dummy-nextauth-secret-for-ci-testing
          NEXTAUTH_URL=http://localhost:3000
          EOF

      - name: Run unit tests
        run: npm run test:unit

  build:
    name: Build
    needs: typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Create .env.local for build
        run: |
          cat > .env.local << EOF
          NEXT_PUBLIC_SUPABASE_URL=https://dummy.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY=dummy-anon-key
          YOUTUBE_API_KEY=dummy-youtube-api-key
          SUPABASE_SERVICE_ROLE_KEY=dummy-service-role-key
          NEXTAUTH_SECRET=dummy-nextauth-secret-for-ci-build
          NEXTAUTH_URL=http://localhost:3000
          EOF

      - name: Build Next.js application
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: .next
          retention-days: 1

  security:
    name: Security Scan
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect leaked secrets in NEXT_PUBLIC_ variables
        run: |
          echo "Checking for secrets exposed via NEXT_PUBLIC_ variables..."
          if grep -r --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' \
            'NEXT_PUBLIC_.*SECRET\|NEXT_PUBLIC_.*SERVICE_ROLE\|NEXT_PUBLIC_.*API_KEY' \
            app/ lib/ ; then
            echo "❌ NEXT_PUBLIC_ に SECRET / SERVICE_ROLE / API_KEY が含まれています"
            exit 1
          else
            echo "✓ NEXT_PUBLIC_ に機密情報は検出されませんでした"
          fi

  db-migration:
    name: DB Migration Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify migration files syntax
        run: |
          # マイグレーションファイルが存在するか確認
          if [ -d "supabase/migrations" ]; then
            echo "✓ マイグレーションディレクトリが存在します"

            # SQLファイルの構文チェック（基本的な検証）
            for file in supabase/migrations/*.sql; do
              if [ -f "$file" ]; then
                echo "検証中: $file"
                # SQLファイルに基本的な構文エラーがないか確認
                if grep -q "CREATE\|ALTER\|DROP\|INSERT\|UPDATE\|DELETE" "$file"; then
                  echo "  ✓ SQL文が含まれています"
                else
                  echo "  ⚠ SQL文が見つかりません（空ファイルの可能性）"
                fi
              fi
            done
          else
            echo "⚠ マイグレーションディレクトリが存在しません"
          fi

      - name: Check for migration conflicts
        run: |
          # マイグレーションファイル名の重複チェック
          if [ -d "supabase/migrations" ]; then
            duplicates=$(ls supabase/migrations/*.sql 2>/dev/null | xargs -n1 basename | sort | uniq -d)
            if [ -n "$duplicates" ]; then
              echo "❌ 重複するマイグレーションファイルが見つかりました:"
              echo "$duplicates"
              exit 1
            else
              echo "✓ マイグレーションファイル名の重複はありません"
            fi
          fi

      - name: Verify Supabase config
        run: |
          if [ -f "supabase/config.toml" ]; then
            echo "✓ Supabase設定ファイルが存在します"
            # 設定ファイルの基本的な検証
            if grep -q "\[db\]" supabase/config.toml; then
              echo "  ✓ データベース設定が含まれています"
            fi
          else
            echo "⚠ supabase/config.toml が見つかりません"
          fi
